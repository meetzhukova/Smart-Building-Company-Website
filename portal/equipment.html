<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/equipment.css" />
  <title>Devices – TFB Portal</title>
</head>
<body>
  <main class="portal">
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <img src="../assets/logoIcon.svg" alt="" class="sidebar-brand__icon">
        <span class="sidebar-brand__text">Tech Forward<br>Builders</span>
      </a>
      <nav class="sidebar-nav">
        <a href="portal.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
          <span>Dashboard</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="equipment.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
          <span>Devices</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="status.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M10 19V9M16 19v-6M22 19V3"/></svg>
          <span>Status</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="register.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          <span>Register</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="database.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/></svg>
          <span>Database</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
      </nav>
    </aside>

    <section class="content">
      <header class="content-header">
        <h1 class="page-title">All Devices</h1>
        <div class="header-actions">
          <a href="../index.html" class="header-link">Back to website</a>
          <button type="button" class="logout-btn" onclick="logout()">Log out</button>
          <span class="user-pill" id="userInfo">Signed in as —</span>
          <div class="user-avatar" id="userAvatar">—</div>
        </div>
      </header>

      <div class="toolbar">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="searchInput" placeholder="Search devices..." />
        </div>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="Active">Online</option>
          <option value="Testing">Testing</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Offline">Offline</option>
        </select>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Device Name</th>
              <th>Type</th>
              <th>Status</th>
              <th>Location</th>
              <th>Last Updated</th>
              <th>Registered By</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="deviceTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>Edit Device</h2>
      <div class="modal-field">
        <label>Device Name</label>
        <input type="text" id="editName" />
      </div>
      <div class="modal-field">
        <label>Type</label>
        <input type="text" id="editType" />
      </div>
      <div class="modal-field">
        <label>Status</label>
        <select id="editStatus">
          <option value="Active">Active</option>
          <option value="Testing">Testing</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Offline">Offline</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Location</label>
        <input type="text" id="editLocation" />
      </div>
      <div class="modal-field">
        <label>Registered by</label>
        <p class="modal-readonly" id="editRegisteredBy">—</p>
      </div>
      <div class="modal-field">
        <label>Notes</label>
        <textarea id="editNotes" rows="4" placeholder="Optional notes..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="noteModal">
    <div class="modal modal--note">
      <h2>Device Note</h2>
      <p class="note-content" id="noteContent"></p>
      <div class="modal-actions">
        <button class="save-btn" type="button" onclick="closeNoteModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script type="module" src="../javascript/equipment.js"></script>
</body>
</html>
