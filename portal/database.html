<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/portal.css" />
  <title>Database – TFB Portal</title>
</head>
<body>
  <main class="portal">
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <img src="../assets/logoIcon.svg" alt="" class="sidebar-brand__icon">
        <span class="sidebar-brand__text">Tech Forward<br>Builders</span>
      </a>
      <nav class="sidebar-nav">
        <a href="portal.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
          <span>Dashboard</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="equipment.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
          <span>Devices</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="status.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M10 19V9M16 19v-6M22 19V3"/></svg>
          <span>Status</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="register.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          <span>Register</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="database.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/></svg>
          <span>Database</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
      </nav>
    </aside>

    <section class="content">
      <header class="content-header">
        <div>
          <h1 class="page-title">Database</h1>
          <p class="page-subtitle">All collections stored in Firebase Firestore.</p>
        </div>
        <div class="header-actions">
          <a href="../index.html" class="header-link">Back to website</a>
          <button type="button" class="logout-btn" onclick="logout()">Log out</button>
          <span class="user-pill" id="userInfo">Signed in as —</span>
          <div class="user-avatar" id="userAvatar">—</div>
        </div>
      </header>

      <div class="table-card">
        <div class="panel-head">
          <h2>Devices</h2>
          <p class="panel-note" id="deviceCount">0 records</p>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Type</th>
              <th>Status</th>
              <th>Location</th>
              <th>Last Updated</th>
              <th>Registered By</th>
            </tr>
          </thead>
          <tbody id="devicesTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>

  <script type="module">
    import { db } from "../javascript/firebase.js";
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const getStatusPill = (status) => {
      const value = (status || "").toLowerCase();
      let className = "status-pill--default";
      let label = status || "—";
      if (value === "active") { className = "status-pill--online"; label = "Online"; }
      else if (value === "offline") { className = "status-pill--offline"; label = "Offline"; }
      else if (value === "testing") { className = "status-pill--testing"; }
      else if (value === "maintenance") { className = "status-pill--maintenance"; }
      return `<span class="status-pill ${className}">${label}</span>`;
    };

    onSnapshot(collection(db, "devices"), snapshot => {
      const devices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      document.getElementById("deviceCount").textContent = devices.length + " records";
      const tbody = document.getElementById("devicesTable");
      tbody.innerHTML = "";
      devices.forEach(d => {
        tbody.innerHTML += `
          <tr>
            <td style="color:#9ca3af;font-size:12px;">${d.id.slice(0, 8)}…</td>
            <td>${d.name}</td>
            <td>${d.type}</td>
            <td>${getStatusPill(d.status)}</td>
            <td>${d.location}</td>
            <td>${d.lastChecked || "—"}</td>
            <td>${d.registeredBy || "—"}</td>
          </tr>
        `;
      });
    });
  </script>
</body>
</html>
