<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/register.css" />
  <title>Register Device – TFB Portal</title>
</head>
<body>
  <main class="portal">
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <img src="../assets/logoIcon.svg" alt="" class="sidebar-brand__icon">
        <span class="sidebar-brand__text">Tech Forward<br>Builders</span>
      </a>
      <nav class="sidebar-nav">
        <a href="portal.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
          <span>Dashboard</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="equipment.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
          <span>Devices</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="status.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M10 19V9M16 19v-6M22 19V3"/></svg>
          <span>Status</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="register.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          <span>Register</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
        <a href="database.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/></svg>
          <span>Database</span>
          <span class="sidebar-link__chevron">›</span>
        </a>
      </nav>
    </aside>

    <section class="content">
      <header class="content-header">
        <div>
          <h1 class="page-title">Register Device</h1>
          <p class="page-subtitle">Add a new IoT device to the system.</p>
        </div>
        <div class="header-actions">
          <a href="../index.html" class="header-link">Back to website</a>
          <button type="button" class="logout-btn" onclick="logout()">Log out</button>
          <span class="user-pill" id="userInfo">Signed in as —</span>
          <div class="user-avatar" id="userAvatar">—</div>
        </div>
      </header>

      <div class="panel">
        <div class="panel-head">
          <h2>Device Information</h2>
        </div>
        <div class="panel-body">
          <form class="register-form" id="registerForm">
            <div class="field">
              <label>Device Name</label>
              <input type="text" id="deviceName" placeholder="e.g. Temp Sensor A" required />
            </div>
            <div class="field">
              <label>Device Type</label>
              <input type="text" id="deviceType" placeholder="e.g. IoT Sensor" required />
            </div>
            <div class="field">
              <label>Status</label>
              <select id="deviceStatus">
                <option value="Active">Active</option>
                <option value="Testing">Testing</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Offline">Offline</option>
              </select>
            </div>
            <div class="field">
              <label>Location</label>
              <input type="text" id="deviceLocation" placeholder="e.g. Floor 2, Room 204" required />
            </div>
            <div class="field field--full">
              <label>Notes</label>
              <textarea id="deviceNotes" rows="4" placeholder="Optional notes about this device..."></textarea>
            </div>
            <div class="field field--full registered-by">
              <label>Registered by</label>
              <p class="registered-by-name" id="registeredByName">—</p>
            </div>
            <div class="submit-row">
              <button type="submit" class="submit-btn">Register Device</button>
              <p class="success-msg" id="successMsg">✓ Device registered successfully!</p>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script type="module" src="../javascript/register.js"></script>
</body>
</html>
