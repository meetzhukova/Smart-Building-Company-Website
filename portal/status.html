<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/status.css" />
  <title>Status – TFB Portal</title>
</head>
<body>
  <main class="portal">
    <aside class="sidebar">
      <a href="../index.html" class="logo">TFB</a>
      <nav>
        <a href="portal.html">Dashboard</a>
        <a href="equipment.html">Equipment</a>
        <a href="status.html" class="active">Status</a>
        <a href="register.html">Register Device</a>
        <a href="database.html">Database</a>
      </nav>
    </aside>

    <section class="content">
      <div class="topbar">
        <div>
          <p class="badge">Employee Portal</p>
          <h1>Status Overview</h1>
          <p class="subtitle">Live status of all registered IoT devices.</p>
        </div>
        <div class="topbar-right">
          <div class="user-info" id="userInfo">Signed in as —</div>
          <a href="../index.html" class="back-btn">Back to website</a>
        </div>
      </div>

      <div class="cards" style="margin-bottom:40px;">
        <div class="card"><p>Total</p><h2 id="totalCount">0</h2></div>
        <div class="card"><p style="color:#4ade80">Active</p><h2 id="activeCount" style="color:#4ade80">0</h2></div>
        <div class="card"><p style="color:#60a5fa">Maintenance</p><h2 id="maintenanceCount" style="color:#60a5fa">0</h2></div>
        <div class="card"><p style="color:#f87171">Offline</p><h2 id="offlineCount" style="color:#f87171">0</h2></div>
      </div>

      <div class="status-grid" id="statusGrid">
        <div class="empty-state">Loading devices...</div>
      </div>
    </section>
  </main>

  <script>
    const currentUser = sessionStorage.getItem('user');
    if (!currentUser) {
      window.location.href = 'login.html';
    } else {
      const user = JSON.parse(currentUser);
      document.getElementById('userInfo').textContent = `Signed in as ${user.name}`;
    }
  </script>

  <script type="module">
    import { db } from "../javascript/firebase.js";
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const grid = document.getElementById("statusGrid");

    function dotClass(status) {
      return "dot-" + status.toLowerCase();
    }

    function pillClass(status) {
      return "pill-" + status.toLowerCase();
    }

    onSnapshot(collection(db, "devices"), snapshot => {
      const devices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      document.getElementById("totalCount").textContent = devices.length;
      document.getElementById("activeCount").textContent = devices.filter(d => d.status === "Active").length;
      document.getElementById("maintenanceCount").textContent = devices.filter(d => d.status === "Maintenance").length;
      document.getElementById("offlineCount").textContent = devices.filter(d => d.status === "Offline").length;

      if (devices.length === 0) {
        grid.innerHTML = '<div class="empty-state">No devices registered yet.</div>';
        return;
      }

      grid.innerHTML = "";
      devices.forEach(device => {
        const s = device.status || "Offline";
        grid.innerHTML += `
          <div class="device-card ${s.toLowerCase()}">
            <div class="device-card-top">
              <div>
                <p class="device-name">${device.name}</p>
                <p class="device-type">${device.type}</p>
              </div>
              <div class="status-dot ${dotClass(s)}"></div>
            </div>
            <div class="device-meta">
              <p>Location: <span>${device.location}</span></p>
              <p>Last checked: <span>${device.lastChecked}</span></p>
            </div>
            <span class="status-pill ${pillClass(s)}">${s}</span>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
